0=Bring den Mann zu mir, der\nvor dem Hamburger-Lokal\nsteht!
1=Finde den Ballon im\nHimmel der Mystic Ruins!
2=Sammle 100 Ringe und\ngeh zu Sonics\nPlakatwand am Pool! 
3=Hier wächst überall\nUnkraut! Es muss\nentfernt werden!
4=Ich verlor meinen Ballon! Er\nist schon ganz weit oben!
5=Er wird ertrinken! Hilf dem\nMann im Wasser!
6=Metal Sonic braucht einen\nFreund… Sieh gut hin.
7=Das Medaillon ist dort\nhineingefallen! Illegales\nParken verboten!
8=Hol den Ballon, der hinter\ndem Wasserfall in der Nähe\ndes Emeraldsees schwebt.
9=Was glänzt dort im Wasser?
10=Zerstöre die Windmühle\nund fahre fort. Finde den\nkreisenden Ballon!
11=Es verbirgt sich etwas unter \nChaos gutem Freund!
12=So kann ich nicht duschen!\nTu etwas!
13=Ich bin der Inhaber dieses\nHotels. Versuch mich doch\nzu fangen!
14=Mein Medaillon wehte\nvom Tornado weg! Hilft\nmir, es zu finden!
15=Sammle die Fahnen auf\nder schwimmenden Insel!
16=Ziele und schieße mit\neinem Sonicball auf\nalle Medaillons.
17=Achte auf deinen Sprung auf \neinem Tisch nachts \nim Park!
18=Was verbirgt sich hinter\ndem Spiegel?
19=Sammle alle Medaillons\ninnerhalb des Zeitlimits!\nPass auf, es ist\nziemlich glatt!
20=Schütz die Sonic-Puppe vor\nden Spinners um sie herum!
21=Finde die Fahne im\nGeheimgang unter dem\nEmeraldmeer!
22=Lauf um das hölzerne Pferd\nund sammle 10 Ballons!
23=’Ich hasse diesen dunklen,\ndreckigen Ort!’ Kannst du\nihn finden?
24=Was verbirgt sich unter\nder rechten Tatze des\nLöwen?
25=Was bist auf dem\nSchiffsmast und wird von\nPiraten beschützt?
26=Sammle 100 Ringe und\ngeh zum Heliport!
27=Benutz den Brunnen, um den\nBallon morgens im Verkehr\nzu fangen!
28=Ich bin der Wächter dieses\nKanals! Fang mich doch!
29=Jemand ist aus dem\nGefängnis der Hölle\ngeflüchtet!\nFinde den Flüchtling!
30=Hol den Ballon, während du\nmit dem Schutt in der Luft\nschwebst!
31=Kannst du den Ballon\nsammeln, der unter der\nBrücke verborgen ist?
32=Schieß dich durch die\nKanone und sammle\ndie Fahne ein!
33=Kannst du den Ballon\nsammeln, der unter der\nSchiffsbrücke\nverborgen ist?
34=Ich bin der Wächter dieses\nEissees. Fang mich doch!
35=Überall fliegen Kampf-\nflugzeuge herum. Hilft mir\nhier herauszukommen!
36=Flieg über den Dschungel\nund sammle alle Ballons!
37=Botschaft eines Volks:\nIn der Richtung, des\nbrennenden Pfeils\nwirst du etwas sehen... 
38=Schatzsuche am Strand!\nFinde alle Medaillons\nim Zeitlimit!
39=Was ist an dem Ort, den die\nriesige Schlange anstarrt?
40=Sieh genau hin, während\ndu den Wasserfall\nhinunter fällst!
41=Ich komme nicht ins\nBadezimmer. Bitte\nhelft mir!
42=Festung aus Stahl.\nHohe Sprünge auf 3 schmalen\nPfaden. Fall bloß nicht hin!
43=Ich bin der Wächter dieses\nSchiffs! Fang mich doch!
44=Begib dich an den Ort, an\ndem die Ringe in der Form\nvon Sonics Gesicht\nplatziert sind!
45=Eine geheime Basis voller \nmechanischer Fallen. \nPass auf, und du \nwirst etwas sehen
46=Sammle 10 Ballons auf\ndem Spielfeld unter dem\nZeitlimit! 
47=Kannst du das Medaillon\nholen, das der riesige\nSonic anstarrt?
48=Sei blitzschnell und\nsammle alle Flaggen!
49=Wähle eine Straße, die sich\nin 5 Wege teilt, vor Ablauf\nder Zeit.
50=Der Schütze aus dem \nWindy Valley!\nZerstöre alle Spinners\ninnerhalb des Zeitlimits!
51=Sammle 3 Fahnen im\nDschungel unter dem\nZeitlimit!
52=Spring mit 3 superhohen\nSprüngen über die Ringlinie\nauf der Skipiste!
53=Gleite in einem Schneesturm\nabwärts und sammle alle\nFahnen!
54=Lauf das Gebäude hinunter\nund sammle alle Ballons!
55=Gefährliche Eruption in der \nFlammenschlucht. Was \nist in der Rich-\ntung, in die sie blickt?
56=Die Spitze des Vulkans!\nNimm dich vor der\nLava in Acht!
57=Der große Felsen rollt \nhinter dir her! \nVersuch, alle Flaggen \neinzusammeln!
58=Nimm dich vor den Fässern\nin Acht. Find die versteckte\nFahne im Container!
59=Kannst du die Fahne im Kopf \ndes Dinosauriers finden?
60=Mission Clear!
